name: build-init

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compile init (arm64, static, freestanding)
        run: |
          set -euo pipefail
          cd initbuild
          clang --version
          CC="clang -arch arm64 -Os -static -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra"
          $CC -Ilibmini -c libmini/mini.c -o mini.o
          clang -arch arm64 -c libmini/start.S -o start.o
          $CC -Ilibmini -Wl,-e,_start -Wl,-pagezero_size,0x100000000 -o init init.c mini.o start.o
          ls -l init
          file init
          otool -hv init

      - name: Report
        run: |
          cd initbuild
          shasum -a 256 init
          otool -l init | grep -A4 LC_UNIXTHREAD | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: init-arm64
          path: initbuild/init
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: init-logs
          path: |
            initbuild/mini.o
            initbuild/start.o
          if-no-files-found: ignore