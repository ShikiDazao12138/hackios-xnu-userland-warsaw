name: build-init

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile init (arm64, static, freestanding)
        run: |
          set -euo pipefail
          cd initbuild
          clang --version
          clang -arch arm64 -Os -static -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra -Ilibmini -c libmini/mini.c -o mini.o
          clang -arch arm64 -c libmini/start.S -o start.o
          base="clang -arch arm64 -Os -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra -Ilibmini"
          ld="-Wl,-e,_start -Wl,-pagezero_size,0x100000000"
          if ! $base -static $ld -o init init.c mini.o start.o; then
            echo "static link failed, retrying without -static"
            $base $ld -o init init.c mini.o start.o
          fi
          ls -l init
          file init
          otool -hv init
          shasum -a 256 init

      - uses: actions/upload-artifact@v4
        with:
          name: init-arm64
          path: initbuild/init
          if-no-files-found: error