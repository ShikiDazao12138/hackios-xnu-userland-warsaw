name: probe-macos
on: workflow_dispatch
jobs:
  m26:
    runs-on: macos-26
    steps:
      - run: sw_vers && xcodebuild -version && echo M26-OK
  m15:
    runs-on: macos-15
    steps:
      - run: sw_vers && echo M15-OK
  mlatest:
    runs-on: macos-latest
    steps:
      - run: sw_vers && echo MLATEST-OK