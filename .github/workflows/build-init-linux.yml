name: build-init-linux

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version

      - name: Compile init variants (Mach-O arm64, truly static: no dyld, no LC_MAIN)
        run: |
          set -euo pipefail
          cd initbuild
          TC="--target=arm64-apple-ios14.0"
          CFLAGS="-Os -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra -Ilibmini"
          clang $TC $CFLAGS -c libmini/mini.c -o mini.o
          clang $TC -c libmini/start.S -o start.o
          base="-fuse-ld=lld -Wl,-e,_start -Wl,-pagezero_size,0x100000000 -Wl,-platform_version,ios,14.0,14.0"
          echo "--- A: -Wl,-static"
          clang $TC $CFLAGS $base -Wl,-static -o init-a init.c mini.o start.o
          echo "--- B: -Wl,-static + no_fixup_chains"
          clang $TC $CFLAGS $base -Wl,-static -Wl,-no_fixup_chains -o init-b init.c mini.o start.o
          echo "--- C: -Wl,-static + no_fixup_chains + dead_strip + no_data_const + no_pie"
          clang $TC $CFLAGS $base -Wl,-static -Wl,-no_fixup_chains -Wl,-dead_strip -Wl,-no_data_const -Wl,-no_pie -o init-c init.c mini.o start.o
          for f in init-a init-b init-c; do
            echo "== $f"; ls -l $f; file $f || true; shasum -a 256 $f
          done

      - uses: actions/upload-artifact@v4
        with:
          name: init-static-variants
          path: |
            initbuild/init-a
            initbuild/init-b
            initbuild/init-c
          if-no-files-found: error