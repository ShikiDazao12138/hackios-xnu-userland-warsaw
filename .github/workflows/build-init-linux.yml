name: build-init-linux

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version

      - name: Compile init for arm64 Apple (Mach-O, freestanding)
        run: |
          set -euo pipefail
          cd initbuild
          TC="--target=arm64-apple-ios14.0"
          CFLAGS="-Os -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra -Ilibmini"
          clang $TC $CFLAGS -c libmini/mini.c -o mini.o
          clang $TC -c libmini/start.S -o start.o
          build() {
            out=$1; shift
            clang $TC $CFLAGS -fuse-ld=lld -static \
              -Wl,-e,_start -Wl,-pagezero_size,0x100000000 \
              -Wl,-platform_version,ios,14.0,14.0 "$@" \
              -o "$out" init.c mini.o start.o
          }
          build init            -Wl,-no_pie -Wl,-dead_strip
          build init-nopie       -Wl,-no_pie
          build init-plain
          for f in init init-nopie init-plain; do
            echo "== $f"
            ls -l $f
            file $f
            od -An -tx1 -N32 $f
            shasum -a 256 $f
          done

      - uses: actions/upload-artifact@v4
        with:
          name: init-arm64-variants
          path: |
            initbuild/init
            initbuild/init-nopie
            initbuild/init-plain
          if-no-files-found: error