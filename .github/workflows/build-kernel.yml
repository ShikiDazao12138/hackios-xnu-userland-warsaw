name: build xnu kernel

# The K90 Ultra (warsaw) kernel: xnu-12377.121.6 with xnu26/patches (81 pieces) and xnu/files on
# top, built for arm64 against the runner's own iPhoneOS SDK. tools/kernel/xnu26-xnu.tar.gz carries
# the patch set and the device layer, so nothing of Apple's is stored in this repository.
#
# This is the same path tools/build-kernel.sh takes on the hackintosh, with the one difference the
# machine makes: that host has no Xcode and builds against an SDK mirror, while the runner has both
# Xcode and its SDK, which is what xnu26/deps-macos.sh prefers when it finds one.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'tools/kernel/xnu26-xnu.tar.gz'

env:
  XNU_TAG: xnu-12377.121.6

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for v in 26.6 26.5 26.4 26.3 26.2; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              echo "using Xcode $v"
              break
            fi
          done
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version) at $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Install the build host
        # make from homebrew is GNU make 4.x: Apple's makefiles need -O and parse nproc, neither of
        # which /usr/bin/make (3.81, BSD) has.
        run: |
          set -euo pipefail
          brew install make bison flex || true
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Lay the patch set and the device layer over the tag
        run: |
          set -euo pipefail
          mkdir -p /tmp/k/merge
          tar xzf tools/kernel/xnu26-xnu.tar.gz -C /tmp/k/merge
          chmod +x /tmp/k/merge/xnu-deps/host/bin/* /tmp/k/merge/xnu26/*.sh
          # Only the two shims the build lacks on a runner: iig (Apple ships it closed, the shim
          # takes headers from the SDK) and nproc (macOS has none and Apple's makefiles call it).
          # The xcrun/migcom/codesign shims in the same directory are for a host WITHOUT Xcode and
          # must stay off PATH here, or they shadow the real tools and deps stage 1 fails.
          mkdir -p /tmp/k/shims
          cp /tmp/k/merge/xnu-deps/host/bin/iig /tmp/k/shims/
          cp /tmp/k/merge/xnu-deps/host/bin/nproc /tmp/k/shims/
          chmod +x /tmp/k/shims/*
          echo "XNUDEPS=/tmp/k/merge/xnu-deps" >> "$GITHUB_ENV"
          echo "/tmp/k/shims" >> "$GITHUB_PATH"
          # The iig shim reads the pre-generated DriverKit headers from a macOS SDK tree it names
          # with a fixed path; on the build host that tree was copied out of the Command Line Tools
          # by hand. Link Xcode's Kernel.framework there instead.
          MACSDK=$(xcrun --sdk macosx --show-sdk-path)
          KF="$MACSDK/System/Library/Frameworks/Kernel.framework"
          DEST=/tmp/k/merge/xnu-deps/MacOSX13.3.sdk/System/Library/Frameworks
          mkdir -p "$DEST"
          ln -sfn "$KF" "$DEST/Kernel.framework"
          echo "Kernel.framework -> $(ls -d "$DEST/Kernel.framework/Headers" 2>/dev/null || echo MISSING)"
          ls "$DEST/Kernel.framework/Headers/DriverKit" 2>/dev/null | head -5 || true
          # migcom: Xcode keeps it inside the toolchain, where it is not on PATH.
          MIGCOM=$(find /Applications/Xcode*.app -name migcom -type f 2>/dev/null | head -1)
          if [ -n "$MIGCOM" ]; then ln -sf "$MIGCOM" /tmp/k/shims/migcom; echo "migcom: $MIGCOM"; else echo "migcom: NOT FOUND"; fi
          cd /tmp/k/merge
          export XNU26_SRC="/tmp/k/merge/xnu-src/$XNU_TAG"
          bash xnu26/apply.sh "$XNU26_SRC"
          grep -c . xnu26/patches/series
          # TestDextRematch: iig cannot generate its IOKit metaclass, and the build host's tree
          # comments these entries out for the same reason. This kernel loads no dext, so nothing
          # the device needs comes from them.
          # Two things come out of iokit/conf/files here, both because the iig shim cannot produce
          # what they need: TestDextRematch's metaclass, and IOExtensiblePaniclog's Dispatch, which
          # the kernel then fails to link (vtable for IOExtensiblePaniclog, undefined symbol).
          # The build host's tree comments the same lines out.
          for f in "$XNU26_SRC"/iokit/conf/files*; do
            sed -i '' 's|^\([^#].*TestDextRematch.*\)|#\1|' "$f"
            sed -i '' 's|^\([^#].*IOExtensiblePaniclog.*\)|#\1|' "$f"
          done
          grep -rn 'TestDextRematch\|IOExtensiblePaniclog' "$XNU26_SRC/iokit/conf" | head -10 || true
          # Apple's osfmk/conf/files leaves mc_ce_arm64.c out, so the link fails on the symbols
          # minicrypto's SHA-512 path calls (_mc_ce_sha512_compress and friends).
          grep -q 'minicrypto/mc_ce_arm64.c' "$XNU26_SRC/osfmk/conf/files" || \
            printf 'osfmk/minicrypto/mc_ce_arm64.c\tstandard\n' >> "$XNU26_SRC/osfmk/conf/files"
          grep -n 'mc_ce_arm64' "$XNU26_SRC/osfmk/conf/files" || true

      - name: deps stage 1
        run: |
          set -euo pipefail
          cd /tmp/k/merge
          XNU26_SRC="/tmp/k/merge/xnu-src/$XNU_TAG" bash xnu26/deps-macos.sh --stage1

      - name: export and install the kernel headers
        run: |
          set -euo pipefail
          cd /tmp/k/merge
          XNU26_SRC="/tmp/k/merge/xnu-src/$XNU_TAG" bash xnu26/build-macos.sh exporthdrs
          XNU26_SRC="/tmp/k/merge/xnu-src/$XNU_TAG" bash xnu26/build-macos.sh installhdrs

      - name: deps stage 2
        run: |
          set -euo pipefail
          cd /tmp/k/merge
          XNU26_SRC="/tmp/k/merge/xnu-src/$XNU_TAG" bash xnu26/deps-macos.sh --stage2

      - name: build the kernel
        run: |
          set -euo pipefail
          cd /tmp/k/merge
          export XNU26_SRC="/tmp/k/merge/xnu-src/$XNU_TAG"
          # Warnings are 90% of this log (a full kernel build emits ~800k lines of them) and none
          # of them can fail the build; what has to survive the filter is the error lines.
          set +e
          bash xnu26/build-macos.sh 2>&1 \
            | grep -vE 'warning: |note: |^ +[0-9]+ \||^ +\^|^ +\||warnings? generated|^\s*$' \
            | tee /tmp/k/build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "=== error digest ==="
            grep -E ': error:|\*\*\* ' /tmp/k/build.log | grep -v ignored | head -40 || true
            exit 1
          fi
          find /tmp/k -name 'mach.development.bcm2837' -type f > /tmp/k/found.txt || true
          cat /tmp/k/found.txt
          K=$(head -1 /tmp/k/found.txt)
          [ -n "$K" ] || { echo "::error::no mach.development.bcm2837 produced"; tail -60 /tmp/k/build.log; exit 1; }
          mkdir -p /tmp/k/out
          cp "$K" /tmp/k/out/kernel.bin
          shasum -a 256 /tmp/k/out/kernel.bin | tee /tmp/k/out/kernel.bin.sha256
          ls -l /tmp/k/out

      - uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-bcm2837
          path: /tmp/k/out/
          if-no-files-found: error

      - name: Leave the kernel where a Windows host can fetch it
        run: |
          set -euo pipefail
          cd /tmp/k/out
          cp /tmp/k/build.log .
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q -b kernel-artifacts
          git add -A
          git commit -qm "kernel: bcm2837 $(date -u +%Y%m%dT%H%M%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin kernel-artifacts
          echo "kernel-artifacts: $(git rev-parse --short HEAD)"
